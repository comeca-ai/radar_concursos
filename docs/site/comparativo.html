<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar Licitações — João Pessoa × Campina Grande</title><link rel="stylesheet" href="shared.css"></head><body>
<main><h1>João Pessoa × Campina Grande</h1><p class="sub" id="meta">Carregando…</p>
<div class="note"><strong>Informativo.</strong> Dados do PNCP; não é parecer jurídico. Verifique prazos e condições no edital original.</div>
<div class="grid2" id="cards"></div>
<section class="panel" aria-label="Lista comparada">
<div class="filters"><label class="q">Buscar no objeto ou órgão<input type="search" id="fq" placeholder="ex.: software, provas digitais"></label>
<label>Cidade<select id="fc"><option value="">Ambas</option><option value="jp">João Pessoa</option><option value="cg">Campina Grande</option></select></label>
<label>Modalidade<select id="fm"><option value="">Todas</option></select></label>
<label>Esfera<select id="fe"><option value="">Todas</option></select></label>
<label class="chk"><input type="checkbox" id="fp"> Só Prefeitura</label></div>
<p class="count" id="cnt" aria-live="polite"></p><div id="res"></div></section></main>
<script src="shared.js"></script><script>
shell("comparativo.html");let D=[];$("res").innerHTML=loading();
fetch("comparativo.json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{
 const p=j.cidades.jp.periodo;$("meta").textContent=`Atualizado ${j.atualizado_em.replace("T"," ").slice(0,16)} (horário de Brasília) · publicações de ${dt(p.inicio)} a ${dt(p.fim)}`;
 for(const[k,c]of Object.entries(j.cidades))c.oportunidades.forEach(o=>D.push({...o,cid:k,pref:(o.id||"").slice(0,14)===c.cnpj_pref}));
 fill($("fm"),D.map(o=>o.modalidade));fill($("fe"),D.map(o=>o.esfera));
 $("cards").innerHTML=Object.entries(j.cidades).map(([k,c])=>{const L=D.filter(o=>o.cid==k),n=f=>L.filter(f).length,mod={};L.forEach(o=>mod[o.modalidade]=(mod[o.modalidade]||0)+1);
  const top=Object.entries(mod).sort((a,b)=>b[1]-a[1]).slice(0,6),mx=top[0]?.[1]||1;
  return `<div class="panel ${k}"><h2 style="margin:0">${esc(c.nome)}</h2><small style="color:var(--muted)">IBGE ${c.ibge} · CNPJ Prefeitura ${c.cnpj_pref}</small>
  <div class="kpis" style="margin:14px 0"><div class="kpi"><b>${c.total}</b><small>licitações</small></div><div class="kpi"><b>${n(o=>o.pref)}</b><small>da Prefeitura</small></div><div class="kpi"><b>${brl(L.reduce((s,o)=>s+(o.valor_estimado||0),0))}</b><small>valor estimado</small></div></div>
  <h3 style="font-size:14px;margin:0 0 6px">Modalidades mais usadas</h3>${top.map(([m,v])=>`<div class="bar"><span title="${esc(m)}">${esc(m)}</span><i style="width:${Math.max(3,v/mx*100)}%"></i>${v}</div>`).join("")}</div>`}).join("");
 ["fc","fm","fe","fp","fq"].forEach(i=>$(i).addEventListener("input",draw));draw();
}).catch(()=>$("res").innerHTML=empty("Não foi possível carregar os dados. Tente recarregar a página."));
function draw(){const c=$("fc").value,m=$("fm").value,e=$("fe").value,p=$("fp").checked,q=$("fq").value.toLowerCase().trim();
 const F=D.filter(o=>(!c||o.cid==c)&&(!m||o.modalidade==m)&&(!e||o.esfera==e)&&(!p||o.pref)&&(!q||((o.objeto||"")+" "+(o.orgao||"")).toLowerCase().includes(q))).sort((a,b)=>(b.data_publicacao||"").localeCompare(a.data_publicacao||""));
 $("cnt").textContent=`${F.length.toLocaleString("pt-BR")} licitações (JP ${F.filter(o=>o.cid=="jp").length} · CG ${F.filter(o=>o.cid=="cg").length})`+(F.length>500?" · mostrando 500 mais recentes":"");
 $("res").innerHTML=F.length?`<div class="tw"><table><thead><tr><th>Cidade</th><th>Órgão</th><th>Modalidade</th><th>Objeto</th><th>Publicação</th><th>Encerramento</th><th>Valor estimado</th><th><span class="sr">Link</span></th></tr></thead><tbody>${F.slice(0,500).map(o=>row(o,1)).join("")}</tbody></table></div>`:empty("Nenhuma licitação com esses filtros.");}
</script></body></html>
